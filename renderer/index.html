<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>dsh-mmy-ttslive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-skin="A">
  <div id="stage" class="stage">
    <!-- A · 通栏条幅 960×118 -->
    <section class="panel panelA">
      <img class="av" src="../assets/avatar.jpg" alt="伊芙">
      <div class="bodyA">
        <div class="who"><b>小伊 · EVE</b><span class="slash">／</span>台词 <span class="live"><i class="dot"></i>LIVE</span></div>
        <div class="tx txA" id="txA"></div>
      </div>
      <div class="prog"><i id="progA"></i></div>
    </section>

    <!-- B · 悬浮卡 720×190 -->
    <section class="panel panelB">
      <div class="card">
        <div class="hd">
          <span class="no" id="noB">EVE·0000</span>
          <span class="nm">台词 / CAPTION</span>
          <span class="tm" id="tmB">--:--:--</span>
        </div>
        <div class="tx txB" id="txB"></div>
        <div class="ft"><span class="track"><i id="progB"></i></span><span class="seg" id="segB">第 0 / 0 段</span></div>
      </div>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
